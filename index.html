<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Style - Smart AI Store & Admin</title>
    <style>
        /* 1. DIZAYN VA ULTRA ZAMONAVIY DARK MODE STYLLARI */
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #222f46;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px 0 30px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        /* TABS (FOYDALANUVCHI / ADMIN O'TISH TUGMALARI) */
        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 10px 24px;
            border-radius: 30px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .section-view {
            display: none;
        }

        .section-view.active {
            display: block;
        }

        /* GRID TIZIMI */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel h2 {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        /* FORMALA VA INPUTLAR */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background: var(--accent-hover); }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        .btn-danger { background: var(--danger); padding: 5px 10px; font-size: 0.8rem; width: auto; }

        /* KIYINTIRISH STUDIYASI */
        .fitting-box {
            height: 200px;
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* KATALOG */
        .clothing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .card-title { font-weight: 600; font-size: 0.95rem; }
        .card-meta { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

        /* ADMIN BUYURTMALAR JADVALLARI */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        th { color: var(--accent); }

        .badge {
            background: var(--card-border);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Smart AI Fashion Store</h1>
        <p style="color: var(--text-sub); font-size: 0.9rem;">Aqlli kiytirish va buyurtmalar tizimi</p>
    </header>

    <!-- NAVIGATSIYA (REJIMLARNI ALASHTIRISH) -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('store')">🛍️ Xaridor Bo'limi</button>
        <button class="tab-btn" onclick="switchTab('admin')">⚙️ Admin Paneli</button>
    </div>

    <!-- ================= 1. XARIDOR BO'LIMI ================= -->
    <div id="store-section" class="section-view active">
        <div class="container">
            <!-- CHAP PANEL: Kiyintirish va Buyurtma berish -->
            <div>
                <!-- Kiyintirib ko'rish -->
                <div class="panel" style="margin-bottom: 20px;">
                    <h2>Virtual Kiyintirish</h2>
                    <div class="fitting-box" id="fittingRoom">
                        <p id="fittingText" style="color: var(--text-sub); font-size: 0.85rem;">Kiyim tanlang va kiyintiring</p>
                        <img id="fittedImage" src="" style="max-height: 160px; display: none; border-radius: 8px;">
                    </div>
                </div>

                <!-- Buyurtma berish formasi -->
                <div class="panel">
                    <h2>Buyurtma Rasmiylashtirish</h2>
                    <div class="form-group">
                        <label>Tanlangan Kiyim</label>
                        <input type="text" id="orderItemName" readonly placeholder="Katalogdan kiyim tanlang">
                    </div>
                    <div class="form-group">
                        <label>Ismingiz</label>
                        <input type="text" id="custName" placeholder="Ali Valiyev">
                    </div>
                    <div class="form-group">
                        <label>Telefon raqam</label>
                        <input type="text" id="custPhone" placeholder="+998 90 123 45 67">
                    </div>
                    <div class="form-group">
                        <label>Sizning Razmeringiz (O'lcham)</label>
                        <select id="custSize">
                            <option value="S">S (Small)</option>
                            <option value="M">M (Medium)</option>
                            <option value="L">L (Large)</option>
                            <option value="XL">XL (Extra Large)</option>
                            <option value="XXL">XXL (2X Large)</option>
                        </select>
                    </div>
                    <button class="btn btn-success" onclick="placeOrder()">Buyurtmani Tasdiqlash</button>
                </div>
            </div>

            <!-- O'NG PANEL: Katalog va Saralash -->
            <div class="panel">
                <h2>Kiyimlar Kolleksiyasi</h2>
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Razmer bo'yicha mosini topish:</label>
                    <select id="sizeFilter" onchange="filterClothes()">
                        <option value="all">Barcha razmerlar</option>
                        <option value="S">S razmerga mos</option>
                        <option value="M">M razmerga mos</option>
                        <option value="L">L razmerga mos</option>
                        <option value="XL">XL razmerga mos</option>
                        <option value="XXL">XXL razmerga mos</option>
                    </select>
                </div>

                <div class="clothing-grid" id="clothingGrid">
                    <!-- Dinamik ravishda kiyimlar chiqadi -->
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 2. ADMIN PANELI ================= -->
    <div id="admin-section" class="section-view">
        <div class="container">
            <!-- CHAP PANEL: Yangi kiyim qo'shish -->
            <div class="panel">
                <h2>Yangi Kiyim Qo'shish</h2>
                <div class="form-group">
                    <label>Kiyim Nomi</label>
                    <input type="text" id="newTitle" placeholder="Masalan: Oversize Huddi">
                </div>
                <div class="form-group">
                    <label>Mavjud Razmerlar</label>
                    <select id="newSizes" multiple style="height: 80px;">
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                    </select>
                    <small style="color: var(--text-sub); font-size:0.75rem;">Ctrl/Cmd bosib bir nechta razmer tanlang</small>
                </div>
                <div class="form-group">
                    <label>Rasm URL linki</label>
                    <input type="text" id="newImg" placeholder="https://...">
                </div>
                <button class="btn" onclick="addNewProduct()">Do'konga Joylash</button>
            </div>

            <!-- O'NG PANEL: Qabul qilingan Buyurtmalar -->
            <div class="panel">
                <h2>Kelib Tushgan Buyurtmalar</h2>
                
                <!-- Razmer bo'yicha buyurtmalarni filtrlash -->
                <div class="form-group">
                    <label>Mijoz razmeriga qarab saralash:</label>
                    <select id="adminSizeFilter" onchange="renderOrders()">
                        <option value="all">Barchasi</option>
                        <option value="S">Faqat S razmerdagilar</option>
                        <option value="M">Faqat M razmerdagilar</option>
                        <option value="L">Faqat L razmerdagilar</option>
                        <option value="XL">Faqat XL razmerdagilar</option>
                    </select>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mijoz</th>
                                <th>Tel</th>
                                <th>Kiyim</th>
                                <th>Razmer</th>
                                <th>Amal</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Buyurtmalar kelib tushadi -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT MANTIQLARI -->
    <script>
        // 1. MA'LUMOTLAR BAZASI
        let clothes = [
            { id: 1, title: "Qora Urban Huddi", sizes: ["M", "L", "XL"], img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400" },
            { id: 2, name: "Klassik Djinsi Shim", sizes: ["S", "M", "L"], img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400" },
            { id: 3, title: "Oq Oversize Futbolka", sizes: ["S", "M", "L", "XL", "XXL"], img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400" }
        ];

        let orders = [
            { id: 101, customer: "Jasur", phone: "+998901112233", item: "Qora Urban Huddi", size: "L" }
        ];

        // 2. TABLARNI ALASHTIRISH (STORE <-> ADMIN)
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section-view').forEach(sec => sec.classList.remove('active'));

            if(tab === 'store') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('store-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('admin-section').classList.add('active');
                renderOrders();
            }
        }

        // 3. KIYIMLARNI EKRANGA CHIQARISH VA FILTRLASH
        function renderClothes(list = clothes) {
            const grid = document.getElementById('clothingGrid');
            grid.innerHTML = '';

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="card-title">${item.title || item.name}</div>
                    <div class="card-meta">Razmerlar: <span class="badge">${item.sizes.join(', ')}</span></div>
                    <div style="margin-top: 10px; display: flex; gap: 5px;">
                        <button class="btn" style="font-size:0.75rem; padding: 6px;" onclick="tryOn('${item.img}')">Kiyish</button>
                        <button class="btn btn-success" style="font-size:0.75rem; padding: 6px;" onclick="selectForOrder('${item.title || item.name}')">Tanlash</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterClothes() {
            const size = document.getElementById('sizeFilter').value;
            if(size === 'all') {
                renderClothes(clothes);
            } else {
                const filtered = clothes.filter(c => c.sizes.includes(size));
                renderClothes(filtered);
            }
        }

        // 4. KIYINTIRISH VA BUYURTMA SELEKTI
        function tryOn(img) {
            document.getElementById('fittingText').style.display = 'none';
            const imgEl = document.getElementById('fittedImage');
            imgEl.src = img;
            imgEl.style.display = 'block';
        }

        function selectForOrder(title) {
            document.getElementById('orderItemName').value = title;
        }

        function placeOrder() {
            const item = document.getElementById('orderItemName').value;
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const size = document.getElementById('custSize').value;

            if(!item || !name || !phone) {
                alert("Iltimos, kiyim tanlang va barcha maydonlarni to'ldiring!");
                return;
            }

            const newOrder = {
                id: Date.now(),
                customer: name,
                phone: phone,
                item: item,
                size: size
            };

            orders.push(newOrder);
            alert("Buyurtmangiz qabul qilindi! Admin tez orada siz bilan bog'lanadi.");

            // Tozalash
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('orderItemName').value = '';
        }

        // 5. ADMIN PANELDAGI BUYURTMALARNI BOSHQARISH
        function renderOrders() {
            const tbody = document.getElementById('ordersTableBody');
            const filterSize = document.getElementById('adminSizeFilter').value;
            tbody.innerHTML = '';

            let filteredOrders = orders;
            if(filterSize !== 'all') {
                filteredOrders = orders.filter(o => o.size === filterSize);
            }

            if(filteredOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-sub);">Buyurtmalar yo'q</td></tr>`;
                return;
            }

            filteredOrders.forEach(o => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${o.customer}</b></td>
                    <td>${o.phone}</td>
                    <td>${o.item}</td>
                    <td><span class="badge">${o.size}</span></td>
                    <td><button class="btn btn-danger" onclick="deleteOrder(${o.id})">Bajarildi</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteOrder(id) {
            orders = orders.filter(o => o.id !== id);
            renderOrders();
        }

        // 6. YANGI MAHSULOT QO'SHISH (ADMIN)
        function addNewProduct() {
            const title = document.getElementById('newTitle').value;
            const img = document.getElementById('newImg').value;
            const selectSize = document.getElementById('newSizes');
            
            const selectedSizes = Array.from(selectSize.selectedOptions).map(opt => opt.value);

            if(!title || !img || selectedSizes.length === 0) {
                alert("Iltimos, barcha ma'lumotlarni to'liq kiriting!");
                return;
            }

            clothes.push({
                id: Date.now(),
                title: title,
                sizes: selectedSizes,
                img: img
            });

            alert("Yangi kiyim do'konga qo'shildi!");
            renderClothes();

            document.getElementById('newTitle').value = '';
            document.getElementById('newImg').value = '';
        }

        // Dastlabki yuklanish
        renderClothes();
    </script>
</body>
</html>
